spring:
  application:
    name: book-lending-api
  messages:
    basename: errorMessage

  datasource:
    url: jdbc:mysql://${DB_HOST}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

loan:
  rules:
    max-active-loans-per-member: ${LOAN_MAX_ACTIVE_PER_MEMBER:3}
    duration-days: ${LOAN_DURATION_DAYS:14}

security:
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-32-byte-minimum-jwt-secret}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
