spring:
  datasource:
    url: jdbc:mysql://${IT_DB_HOST:localhost}:${IT_DB_PORT:3306}/${IT_DB_NAME:book_lending}
    username: ${IT_DB_USERNAME:book_lending}
    password: ${IT_DB_PASSWORD:book_lending}

  flyway:
    enabled: true
    validate-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

loan:
  rules:
    max-active-loans-per-member: ${IT_LOAN_MAX_ACTIVE_PER_MEMBER:3}
    duration-days: ${IT_LOAN_DURATION_DAYS:14}